<dialog id="edit-schedule-dialog" class="m-auto w-full max-w-lg rounded-lg border-2 border-neutrals-200 bg-neutrals-0 p-6 font-[Lato] text-neutrals-900 shadow-xl backdrop:bg-transparent backdrop:backdrop-blur-md">
    <form id="edit-schedule-form" class="grid gap-4">
        <h2 class="text-lg font-bold">Edit Schedule</h2>
        <label class="grid gap-2 text-sm font-medium text-neutrals-400">
            Schedule Title
            <input class="block w-full rounded-lg border border-neutrals-100 bg-neutrals-50 px-3 py-2.5 text-sm font-semibold text-neutrals-900" name="name" type="text" placeholder="e.g. Fall 2026" maxlength="60" required>
        </label>
        <label class="grid gap-2 text-sm font-medium text-neutrals-400">
            Schedule Color
            <select class="block w-full rounded-lg border border-neutrals-100 bg-neutrals-50 px-3 py-2.5 text-sm font-sans font-semibold text-neutrals-900" name="color">
            </select>
        </label>
        <p class="hidden text-sm text-red-700" data-form-error></p>
        <div class="flex items-center justify-between gap-3">
            <button class="rounded-md bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50" type="button" data-remove-schedule>Remove Schedule</button>
            <div class="flex justify-end gap-3">
                <button class="rounded-md border border-neutrals-200 px-4 py-2 font-semibold hover:bg-neutrals-50" type="button" data-dialog-cancel>Cancel</button>
                <button class="rounded-md bg-purple-400 px-4 py-2 font-semibold text-white hover:bg-purple-500" type="submit">Save Changes</button>
            </div>
        </div>
    </form>
</dialog>
