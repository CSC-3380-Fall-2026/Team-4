{# the "A little overlap goes a long way" chart. friends-calendar.js draws the rows inside #friends-calendar #}
<div id="friends-calendar-scroll" class="overlap-chart">
    <div id="friends-calendar" aria-label="Schedule comparison for one day"></div>
</div>

<div class="overlap-legend" aria-label="Chart legend">
    <span><i class="dot-busy"></i>Busy</span>
    <span><i class="dot-free"></i>Free together</span>
    <span class="overlap-zone">Times shown in Central Time</span>
</div>
