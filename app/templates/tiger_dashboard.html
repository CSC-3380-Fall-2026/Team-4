<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{url_for('static',path='/css/app.css')}}" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <title>Dashboard</title>
</head>
<body class="flex flex-row h-screen w-screen bg-neutrals-0 font-[Lato]">
    {% include "components/dashboard_nav.html" %}
    <div id="workspace" class="flex flex-col w-full h-fit grow min-w-200 ml-64">
        <div id="top-bar" class="flex flex-row w-full h-fit justify-between items-center pl-6 pr-6 pt-4 pb-4 border-b-2 border-neutrals-100 font-bold">
            <p>Dashboard</p>
            <div id="notifications" class="h-6 w-6 rounded-full bg-neutrals-400"></div>
        </div>
<h3>Check Course Prerequisites</h3>
<label for="prereq-course">Course to check:</label>
<input id="prereq-course" placeholder="CSC 4330">

<label for="completed-courses">Completed courses and grades:</label>
<textarea id="completed-courses" rows="4"
placeholder="CSC 3102: B"></textarea>

<button type="button" onclick="checkCoursePrerequisites()">
    Check Prerequisites
</button>

<div id="prereq-result" role="status"></div>

<script>
async function checkCoursePrerequisites() {
    const course = document.getElementById("prereq-course").value.trim().toUpperCase();
    const completed = {};
    const result = document.getElementById("prereq-result");

    for (const line of document.getElementById("completed-courses").value.split("\n")) {
        if (!line.trim()) continue;
        const parts = line.split(":");
        if (parts.length !== 2 || !parts[0].trim() || !parts[1].trim()) {
            result.textContent = "Enter each course as CSC 3102: B";
            return;
        }
        completed[parts[0].trim().toUpperCase()] = parts[1].trim().toUpperCase();
    }

    if (!course) {
        result.textContent = "Please enter a course code.";
        return;
    }

    result.textContent = "Checking...";

    try {
        const response = await fetch("/courses/check-prerequisites", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({course_code: course, completed: completed})
        });
        const data = await response.json();

        if (!response.ok) {
            result.textContent = data.detail || "Unable to check prerequisites.";
            return;
        }

        result.textContent =
            "Satisfied: " + (data.satisfied.join(", ") || "None") + "\n" +
            "Missing: " + (data.missing.join(", ") || "None") + "\n" +
            "Cannot verify: " + (data.cannot_evaluate.join(", ") || "None") + "\n" +
            (data.eligible ? "Requirements satisfied." : "Eligibility not confirmed.");
        result.style.whiteSpace = "pre-line";
    } catch (error) {
        result.textContent = "Could not connect to the prerequisite checker.";
    }
}
</script>
    </div>
</body>
</html>
