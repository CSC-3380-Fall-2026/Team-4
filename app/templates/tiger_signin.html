<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{url_for('static',path='/css/app.css')}}" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <title>Create Account | Tiger Class Drive</title>
</head>
<body class="flex min-h-screen w-screen flex-row bg-neutrals-0 font-[Lato]">
    {% include "components/dashboard_nav.html" %}
    <div class="ml-64 flex min-h-screen w-full min-w-200 grow flex-col">
        <main class="flex w-full max-w-800 flex-1 flex-col items-center justify-center gap-6 bg-neutrals-50 p-6">
            <section class="w-full max-w-md rounded-lg border-2 border-neutrals-200 bg-neutrals-0 p-5" aria-labelledby="signup-title">
                <div class="mb-5">
                    <h1 id="signup-title" class="text-lg font-bold text-neutrals-900">Create your account</h1>
                    <p class="mt-1 text-sm text-neutrals-400">Sign up to get started with Tiger Class Drive.</p>
                </div>
                <form action="/signup" method="post" data-auth-form="signup" class="grid gap-4">
                    <label for="signup-email" class="grid gap-2 text-sm font-semibold text-neutrals-400">
                        Email
                        <input id="signup-email" name="email" type="email" autocomplete="email" required class="block w-full rounded-lg border border-neutrals-100 bg-neutrals-50 px-3 py-2.5 text-sm font-semibold text-neutrals-900 outline-none focus:border-purple-300 focus:ring-2 focus:ring-purple-100">
                    </label>
                    <label for="signup-password" class="grid gap-2 text-sm font-semibold text-neutrals-400">
                        Password
                        <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" required class="block w-full rounded-lg border border-neutrals-100 bg-neutrals-50 px-3 py-2.5 text-sm font-semibold text-neutrals-900 outline-none focus:border-purple-300 focus:ring-2 focus:ring-purple-100">
                        <span class="text-xs font-normal text-neutrals-400">Use at least 6 characters.</span>
                    </label>
                    <p data-auth-message class="hidden rounded-md px-3 py-2 text-sm" role="status" aria-live="polite"></p>
                    <button type="submit" class="w-full rounded-md bg-purple-400 px-4 py-2 font-semibold text-white transition-colors hover:bg-purple-500 focus-visible:outline-2 focus-visible:outline-purple-500">Create Account</button>
                </form>
                <p class="mt-5 text-center text-sm text-neutrals-400">Already have an account? <a href="/login" class="font-semibold text-purple-600 hover:text-purple-700">Log in</a></p>
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', path='/js/auth.js') }}?v=1" defer></script>
</body>
</html>
